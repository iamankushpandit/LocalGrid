<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LocalGrid Demo</title>
<style>
:root {
  --bg: #0d1117; --panel: #161b22; --panel2: #1c2330; --line: #30363d; --text: #e6edf3; --muted: #8b949e;
  --wifi: #58a6ff; --lora: #f0883e; --ok: #3fb950; --bad: #f85149; --ap: #d2a8ff; --hh: #e6edf3;
  --off: #484f58; --accent: #58a6ff; --live: #f85149;
}
:root[data-theme="light"] {
  --bg: #f6f8fa; --panel: #ffffff; --panel2: #f0f3f6; --line: #d0d7de; --text: #1f2328; --muted: #57606a;
  --wifi: #0969da; --lora: #bc4c00; --ok: #1a7f37; --bad: #cf222e; --ap: #8250df; --hh: #1f2328;
  --off: #afb8c1; --accent: #0969da; --live: #cf222e;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, "Segoe UI", sans-serif;
       display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; }
button, select { font: inherit; }

header { display: flex; align-items: center; gap: 14px; padding: 10px 18px; border-bottom: 1px solid var(--line); }
header .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 19px; }
header .status { color: var(--muted); font-size: 14px; }
header .spacer { flex: 1; }
header label { color: var(--muted); display: flex; gap: 6px; align-items: center; cursor: pointer; font-size: 14px; }
header select { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
                padding: 4px 6px; max-width: 240px; }
.dots { display: flex; gap: 5px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); display: block; }
.dots i.live { background: color-mix(in srgb, var(--live) 45%, var(--line)); }
.dots i.on { background: var(--accent); transform: scale(1.3); }

main { display: grid; grid-template-columns: 270px 1fr 330px; min-height: 0; }
aside, .stage { min-height: 0; }
aside { padding: 14px; overflow: auto; }
aside.left { border-right: 1px solid var(--line); }
aside.right { border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); margin: 4px 0 6px; font-weight: 600; }

ol.chapters { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
ol.chapters li button { width: 100%; text-align: left; background: none; border: 0; color: var(--text); cursor: pointer;
                        padding: 6px 8px; border-radius: 6px; display: flex; gap: 8px; align-items: baseline; }
ol.chapters li button:hover { background: var(--panel); }
ol.chapters li.on button { background: var(--panel2); box-shadow: inset 3px 0 0 var(--accent); }
ol.chapters li.done button { color: var(--muted); }
ol.chapters .n { color: var(--muted); font-size: 12px; min-width: 18px; font-variant-numeric: tabular-nums; }
ol.chapters .live { margin-left: auto; font-size: 10px; letter-spacing: .8px; color: var(--live); border: 1px solid var(--live);
                    border-radius: 3px; padding: 0 4px; text-transform: uppercase; }
ol.chapters .na { margin-left: auto; font-size: 10px; color: var(--muted); }

.stage { display: grid; grid-template-rows: auto 1fr; padding: 22px 28px 12px; gap: 14px; overflow: hidden; }
.slide .part { color: var(--accent); font-size: 14px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase;
               display: flex; align-items: center; gap: 10px; }
.slide .part .livebadge { color: #fff; background: var(--live); border-radius: 4px; padding: 1px 7px; font-size: 12px; letter-spacing: 1px; }
.slide h1 { font-size: 34px; line-height: 1.15; margin: 6px 0 10px; letter-spacing: -.3px; }
.slide ul { margin: 0; padding-left: 22px; font-size: 19px; line-height: 1.45; color: var(--text); }
.slide ul li { margin: 3px 0; transition: opacity .6s ease, transform .6s ease; }
.slide ul li.pending { opacity: 0; transform: translateY(6px); }
.slide ul li::marker { color: var(--accent); }
.slide.compact h1 { font-size: 26px; margin-bottom: 4px; }
.slide.compact ul { font-size: 16px; }
.stage.has-media { grid-template-rows: auto 1fr 190px; }
.media { display: flex; gap: 12px; min-height: 0; overflow: hidden; }
.media figure { margin: 0; flex: 0 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.media img, .media video { width: 100%; height: 160px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); }
.media figcaption { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.view { min-height: 0; position: relative; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); overflow: hidden; }
.view > * { position: absolute; inset: 0; width: 100%; height: 100%; }
.view svg { padding: 6px; }
.view iframe { border: 0; background: #fff; }
.view .empty { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 18px; padding: 30px; text-align: center; }
.legend { position: absolute; inset: auto auto 10px 14px; width: auto; height: auto; display: flex; gap: 14px; color: var(--muted); font-size: 13px; }
.legend span::before { content: ""; display: inline-block; width: 18px; height: 0; margin-right: 6px; vertical-align: middle; border-top: 3px solid var(--wifi); }
.legend span.l::before { border-top: 3px dashed var(--lora); }
.legend em { font-style: normal; }
.view svg [data-part] { transition: opacity .6s ease; }
.view svg.pointing [data-part] { opacity: .14; }
.view svg.pointing [data-part].hl { opacity: 1; animation: glow 1.1s ease-in-out infinite alternate; }
@keyframes glow { from { filter: drop-shadow(0 0 0 rgba(255,255,255,0)); } to { filter: drop-shadow(0 0 7px rgba(255,255,255,.9)); } }
.view svg.live [data-part="hops"], .view svg.live [data-part="hhlinks"], .view svg.live [data-part="halo"],
.view svg.live [data-part="gps"], .view svg.live [data-part="nointernet"] { opacity: .12; }
.view svg.live [data-part="lora"] { opacity: .3; }
.view svg.live [data-part="lora"].used { opacity: 1; }
.view svg.live [data-part="aps"] circle:not(.used), .view svg.live g[data-part="handhelds"] rect:not(.used),
.view svg.live [data-part="hhsym"] { opacity: .12; }
.pointer { position: absolute; width: auto; height: auto; inset: auto; transform: translate(-50%, -100%); background: #F2F5F3;
           color: #0B1510; font-weight: 600; font-size: 16px; padding: 7px 12px; border-radius: 8px; max-width: 70%; text-align: center;
           box-shadow: 0 4px 18px rgba(0,0,0,.5); pointer-events: none; animation: in .4s ease-out; }
.pointer::after { content: ""; position: absolute; left: 50%; bottom: -8px; margin-left: -8px; border: 8px solid transparent;
                  border-bottom: 0; border-top-color: #F2F5F3; }
.pointer.below { transform: translate(-50%, 0); }
.pointer.below::after { bottom: auto; top: -8px; border-top: 0; border-bottom: 8px solid #F2F5F3; }
table.hw { position: static; width: 100%; height: auto; border-collapse: collapse; font-size: 16px; }
.hwwrap { overflow: auto; padding: 14px 18px; }
table.hw th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .8px;
              padding: 6px 10px; border-bottom: 1px solid var(--line); }
table.hw td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.hw td .d { color: var(--muted); font-size: 13px; }
.tag { display: inline-block; font-size: 12px; border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; margin: 1px 3px 1px 0; color: var(--muted); }
.tag.y { color: var(--ok); border-color: var(--ok); }

.logs { padding: 10px; display: grid; gap: 8px; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr));
        grid-auto-rows: minmax(0, 1fr); background: var(--bg); }
.logs .tile { min-height: 0; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 8px;
              background: #0a0d12; overflow: hidden; }
:root[data-theme="light"] .logs .tile { background: #fbfcfd; }
.logs .tile h3 { margin: 0; padding: 5px 9px; font-size: 12px; font-weight: 600; border-bottom: 1px solid var(--line);
                 display: flex; gap: 8px; align-items: center; color: var(--text); }
.logs .tile h3 .role { font-size: 10px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); }
.logs .tile h3 .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ap); }
.logs .tile.hh h3 .dot { background: var(--hh); }
.logs .tile.ble h3 .dot { background: var(--wifi); }
.logs pre { margin: 0; padding: 6px 9px; flex: 1; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end;
            font: 11px/1.45 ui-monospace, Consolas, monospace; color: var(--muted); white-space: pre-wrap; word-break: break-word; }
.logs pre span { display: block; }
.logs pre span.W { color: var(--lora); }
.logs pre span.E { color: var(--bad); }
.logs pre span.hot { color: var(--text); }
.btn.on { border-color: var(--accent); color: var(--accent); }
.timer { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
.timer .label { color: var(--muted); font-size: 13px; min-height: 18px; }
.timer .clock { font: 600 42px/1.1 ui-monospace, Consolas, monospace; font-variant-numeric: tabular-nums; }
.timer.done .clock { color: var(--ok); }
.timer.fail .clock { color: var(--bad); }
ul.facts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
ul.facts li { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--ok); border-radius: 8px;
              padding: 7px 10px; animation: in .35s ease-out; }
ul.facts li.bad { border-left-color: var(--bad); }
@keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
ul.log { list-style: none; margin: 0; padding: 0; font: 12px/1.5 ui-monospace, Consolas, monospace; color: var(--muted); }

footer { border-top: 1px solid var(--line); padding: 12px 20px; display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: center; }
footer .caption { font-size: 24px; line-height: 1.3; min-height: 62px; display: flex; align-items: center; }
.controls { display: flex; gap: 8px; }
.btn { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 9px 14px; cursor: pointer; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn.stop { color: var(--bad); border-color: var(--bad); }

@media (max-width: 1100px) {
  main { grid-template-columns: 1fr; overflow: auto; }
  aside.left, aside.right { border: 0; }
  .stage { min-height: 70vh; padding: 16px; }
  body { overflow: auto; }
  footer { grid-template-columns: 1fr; }
  footer .caption { font-size: 19px; }
  .controls { flex-wrap: wrap; }
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="/assets/brand/localgrid-icon.svg" width="28" height="28" alt="">
    LocalGrid
  </div>
  <span class="status" id="status">Connecting…</span>
  <span class="spacer"></span>
  <div class="dots" id="dots"></div>
  <span class="spacer"></span>
  <label><input type="checkbox" id="speak"> Narrate</label>
  <select id="voice" title="Narrator voice"></select>
  <label><input type="checkbox" id="light"> Light</label>
</header>
<main>
  <aside class="left">
    <h2>Chapters</h2>
    <ol class="chapters" id="chapters"></ol>
  </aside>
  <section class="stage">
    <div class="slide" id="slide"><div class="part" id="part"></div><h1 id="title"></h1><ul id="body"></ul></div>
    <div class="view" id="view"></div>
    <div class="media" id="media"></div>
  </section>
  <aside class="right">
    <div class="timer" id="timer"><div class="label" id="tlabel">&nbsp;</div><div class="clock" id="tclock">0.0 s</div></div>
    <h2>What the boards reported</h2>
    <ul class="facts" id="facts"></ul>
    <h2>Grid events</h2>
    <ul class="log" id="log"></ul>
  </aside>
</main>
<footer>
  <div class="caption" id="caption"></div>
  <div class="controls">
    <button class="btn" id="prev" title="Left arrow">◀</button>
    <button class="btn primary" id="play" title="Space">▶ Play all</button>
    <button class="btn" id="here" title="Enter">Present this chapter</button>
    <button class="btn" id="next" title="Right arrow">▶</button>
    <button class="btn" id="logsbtn" title="L">Logs</button>
    <button class="btn stop" id="stop" title="Esc">Stop</button>
    <button class="btn" id="reset" title="R">Reset grid</button>
  </div>
</footer>
<script>
"use strict";
const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
let state = { aps: [], handhelds: [], busy: null, ready: false };
let scenarios = {};               // key -> {title, subtitle, unavailable}
let chapters = [];
let boards = false;
let watchUrl = null;
let at = 0;                       // the chapter on screen
let playing = false;              // Play all, or one chapter, is running
let demoDone = null;              // resolves when the scenario running now ends
const flows = new Map();          // token -> {from, to:Set, path, born}
const bursts = [];
let timerStart = null;

function pref(key, el, apply, dflt) {
  let v = null;
  try { v = localStorage.getItem(key); } catch (e) {}
  el.checked = v === null ? dflt : v === "1";
  apply(el.checked);
  el.addEventListener("change", () => { try { localStorage.setItem(key, el.checked ? "1" : "0"); } catch (e) {} apply(el.checked); });
}
pref("lg-demo-light", $("light"), on => { document.documentElement.dataset.theme = on ? "light" : "dark"; setTimeout(drawMap, 0); }, false);

// ---- narration: the browser's own voice, so a recording needs nobody speaking ----
// Lines are spoken in turn, never cut off. The demo is told when each of its lines ends and waits for
// it before acting, so the words and what happens on the boards stay together.
const sleep = ms => new Promise(r => setTimeout(r, ms));
// Time to take things in (owner, 2026-10-07: the opening went by too fast to absorb).
const PACE = { title: 1800, afterLead: 1000, sentence: 550, afterPoint: 1300, chapterEnd: 3500, afterDemo: 4000 };
const synth = window.speechSynthesis || null;
let openedAt = 0;
let speakingAudio = null;
function narrating() { return (!!synth || localVoices.length > 0) && $("speak").checked; }
function tellNarrate() { fetch("/api/narrate?on=" + (narrating() ? 1 : 0), { method: "POST" }).catch(() => {}); }
pref("lg-demo-speak", $("speak"), on => { if (!on && synth) synth.cancel(); tellNarrate(); }, true);

let localVoiceDefault = null;      // the voice the owner chose, tools/demo.py NARRATOR
let localVoices = [];             // Piper voices tools/demo.py makes on this laptop, if it has any
const PIPER = "piper:";
function fillVoices() {
  const voices = synth ? synth.getVoices().filter(v => /^en/i.test(v.lang)) : [];
  if (!voices.length && !localVoices.length) { if (!synth) { $("voice").hidden = true; $("speak").disabled = true; } return; }
  let saved = null;
  try { saved = localStorage.getItem("lg-demo-voice"); } catch (e) {}
  // The most natural voice there is: a neural voice made on this laptop, then a browser's natural ones
  // (Edge has them; they are online), then whatever is installed.
  const pretty = n => n.replace(/^en_US-/, "").replace(/-(high|medium|low)$/, "").replace(/^./, c => c.toUpperCase());
  const options = localVoices.map(n => ({ value: PIPER + n, label: pretty(n) + " (natural, on this laptop)" }))
    .concat(voices.map(v => ({ value: v.name, label: v.name.replace(/^Microsoft /, "") + (v.localService ? "" : " (online)"),
                               natural: /natural|neural/i.test(v.name), local: v.localService, us: /en-US/i.test(v.lang) })));
  const pick = options.find(o => o.value === saved) || options.find(o => o.value === PIPER + localVoiceDefault) || options.find(o => o.value.startsWith(PIPER))
    || options.find(o => o.natural && o.us) || options.find(o => o.natural) || options.find(o => o.local && o.us) || options[0];
  $("voice").innerHTML = "";
  options.forEach(o => {
    const el = document.createElement("option");
    el.value = o.value; el.textContent = o.label;
    if (o === pick) el.selected = true;
    $("voice").appendChild(el);
  });
}
if (synth) { fillVoices(); synth.onvoiceschanged = fillVoices; }
$("voice").addEventListener("change", () => { try { localStorage.setItem("lg-demo-voice", $("voice").value); } catch (e) {} });

function spokenForm(text) {
  return text.replace(/(\d) s\b/g, "$1 seconds").replace(/(\d) %/g, "$1 percent")
             .replace(/\bSOS\b/g, "S O S").replace(/\bAP\b/g, "access point").replace(/\bD(\d+)\b/g, "decision $1");
}
// Resolves when the text has been spoken, or after the time it would take to read when nobody speaks.
// Spoken a sentence at a time: Chrome can stop a long utterance part-way, and a chapter's caption then
// shows the sentence being said rather than a paragraph.
function sentences(text) { return text.match(/[^.!?]+[.!?]+(\s|$)|[^.!?]+$/g) || [text]; }
const audioCache = new Map();
function piperAudio(text) {
  const key = spokenForm(text) + "";
  const id = $("voice").value + "|" + key;
  if (!audioCache.has(id)) {
    const a = new Audio("/api/tts?voice=" + encodeURIComponent($("voice").value.slice(PIPER.length)) +
                        "&text=" + encodeURIComponent(key));
    a.preload = "auto";
    audioCache.set(id, a);
    if (audioCache.size > 80) audioCache.delete(audioCache.keys().next().value);
  }
  return audioCache.get(id);
}
function sayOne(text) {
  if ($("voice").value.startsWith(PIPER)) {
    return new Promise(resolve => {
      const a = piperAudio(text);
      a.currentTime = 0;
      a.onended = resolve; a.onerror = resolve;
      a.play().catch(resolve);
      speakingAudio = a;
    });
  }
  return new Promise(resolve => {
    const u = new SpeechSynthesisUtterance(spokenForm(text));
    const v = synth.getVoices().find(x => x.name === $("voice").value);
    if (v) u.voice = v;
    u.onend = resolve; u.onerror = resolve;
    synth.speak(u);
  });
}
async function say(text, n, caption) {
  if (!narrating()) {
    if (caption) $("caption").textContent = text;
    if (!n) await sleep(Math.min(12000, 1500 + text.split(/\s+/).length * 330));
  } else {
    const parts = sentences(text).map(s => s.trim()).filter(Boolean);
    // The next sentence is made while this one plays, so there is no gap between them.
    if ($("voice").value.startsWith(PIPER)) parts.forEach(piperAudio);
    for (let k = 0; k < parts.length; k++) {
      const s = parts[k];
      if (caption) { if (!playing) break; $("caption").textContent = s; }
      await sayOne(s);
      if (caption && k < parts.length - 1) await sleep(PACE.sentence);
    }
  }
  if (n) fetch("/api/spoken?n=" + n, { method: "POST" }).catch(() => {});
}

async function post(path) {
  const r = await fetch(path, { method: "POST" });
  if (!r.ok) { const j = await r.json().catch(() => ({})); $("status").textContent = "Not now: " + (j.error || r.status); return false; }
  return true;
}

// ---- chapters ----
function shortPart(c) {
  const s = c.part.replace(/^Live: /, "");
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function chapterState(c) {
  if (c.action === "untether" || c.action === "tether")
    return { live: true, why: !boards ? "page only: no boards are open" : null };
  if (!c.demo) return { live: false };
  const s = scenarios[c.demo];
  return { live: true, why: !s ? "not in this build" : s.unavailable };
}
function renderChapters() {
  const ol = $("chapters");
  ol.innerHTML = "";
  chapters.forEach((c, i) => {
    const li = document.createElement("li");
    li.className = (i === at ? "on" : "") + (i < at ? " done" : "");
    const b = document.createElement("button");
    const st = chapterState(c);
    b.innerHTML = `<span class="n">${i + 1}</span><span class="t"></span>` +
      (st.live ? (st.why ? `<span class="na">needs setup</span>` : `<span class="live">live</span>`) : "");
    b.querySelector(".t").textContent = shortPart(c);
    if (st.why) b.title = st.why;
    b.onclick = () => { if (!playing) show(i); };
    li.appendChild(b);
    ol.appendChild(li);
  });
  $("dots").innerHTML = chapters.map((c, i) => `<i class="${i === at ? "on" : ""} ${c.demo ? "live" : ""}"></i>`).join("");
}
function renderControls() {
  const c = chapters[at] || {};
  const st = chapterState(c);
  $("play").textContent = playing ? "❚❚ Pause" : "▶ Play all";
  $("prev").disabled = playing || at === 0;
  $("next").disabled = playing || at >= chapters.length - 1;
  $("here").disabled = playing || !!state.busy || (st.live && (!!st.why || !state.ready))
    || (c.action === "untether" && !!state.untethered) || (c.action === "tether" && !state.untethered);
  $("stop").disabled = !playing && !state.busy;
  $("reset").disabled = !boards || !!state.busy || playing || !!state.untethered;
  const how = state.untethered ? "heard over Bluetooth, no cables" : "on the bench";
  $("status").textContent = !boards ? "No boards open: the presentation only" : !state.ready ? "Warming up the grid…" :
    state.busy ? "Live demo running" : `${state.aps.length} access points, ${state.handhelds.length} handhelds ${how}`;
}

function bulletsOf(c) { return c.points ? c.points.map(p => p.text) : (c.body || []); }
// While playing, a chapter's points appear one at a time, as they are said.
function hideBullets() { [...$("body").children].forEach(li => li.classList.add("pending")); }
function reveal(k) { const li = $("body").children[k]; if (li) li.classList.remove("pending"); }
function revealAll() { [...$("body").children].forEach(li => li.classList.remove("pending")); }
function show(i) {
  at = Math.max(0, Math.min(chapters.length - 1, i));
  const c = chapters[at];
  const st = chapterState(c);
  $("part").innerHTML = "";
  $("part").append(shortPart(c));
  if (st.live) { const b = document.createElement("span"); b.className = "livebadge"; b.textContent = "LIVE"; $("part").prepend(b); }
  $("title").textContent = c.title;
  $("body").innerHTML = "";

  // Where bench access points go: MAIN first (Everest is MAIN, with the GPS), then the other access points
  // that carry LoRa, then the rest of the ring.
  const tr = g => (g.getAttribute("transform").match(/translate\(([-\d.]+) ([-\d.]+)\)/) || []).slice(1).map(Number);

  const near = (x, y) => circles.reduce((b, c) => Math.hypot(c.x - x, c.y - y) < Math.hypot(b.x - x, b.y - y) ? c : b, circles[0]);
  const withLora = new Set(antennas.map(g => near(...tr(g))));

function focusOn(name) {

  if (!boxes.length) return;

    if (s <= segs[i] || i === segs.length - 1) { const t = segs[i] ? Math.min(1, s / segs[i]) : 1;
      return { x: pts[i].x + (pts[i+1].x - pts[i].x) * t, y: pts[i].y + (pts[i+1].y - pts[i].y) * t }; }
    s -= segs[i];
  }
  return pts[pts.length - 1];
}
function animate(now) {
  const fx = document.getElementById("fx");
  if (fx) {
    fx.innerHTML = "";
    flows.forEach(f => {
      const period = f.path === "lora" ? 2600 : 1100;
      f.to.forEach(name => {
        const pts = route(f.from, name); if (!pts) return;
        const p = along(pts, ((now - f.born) % period) / period);
        el("circle", { cx: p.x, cy: p.y, r: 8, fill: f.path === "lora" ? "var(--lora)" : "var(--wifi)" }, fx);
      });
    });
    for (let i = bursts.length - 1; i >= 0; i--) {
      const b = bursts[i], age = now - b.at, k = nameToKey(b.name);
      if (age > 1200) { bursts.splice(i, 1); continue; }
      if (!k || !pos[k]) continue;
      el("circle", { cx: pos[k].x, cy: pos[k].y, r: 30 + age / 15, fill: "none", stroke: "var(--ok)", "stroke-width": 4, opacity: 1 - age / 1200 }, fx);
    }
  }
  if (timerStart !== null) $("tclock").textContent = ((now - timerStart) / 1000).toFixed(1) + " s";
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

// ---- playing ----
async function present(i) {
  show(i);
  const c = chapters[i];
  const st = chapterState(c);
  hideBullets();
  await sleep(PACE.title);
  if (!playing) { revealAll(); return; }
  if (c.points) {
    if (c.lead) { if (c.lead_focus) focusOn(c.lead_focus); await say(c.lead, 0, true); await sleep(PACE.afterLead); }
    for (let k = 0; k < c.points.length && playing; k++) {
      reveal(k);
      if (c.points[k].focus && viewNow === "diagram") focusOn(c.points[k].focus);
      await say(c.points[k].say, 0, true);
      await sleep(PACE.afterPoint);
    }
  } else {
    // One narration for the whole chapter: its points appear in step with its sentences.
    const parts = sentences(c.say || "").map(s => s.trim()).filter(Boolean);
    const n = $("body").children.length;
    const focuses = c.focuses || [];
    for (let k = 0; k < parts.length && playing; k++) {
      for (let j = 0; j < Math.ceil((k + 1) * n / parts.length); j++) reveal(j);
      const f = focuses[Math.floor(k * focuses.length / parts.length)];
      if (f && viewNow === "diagram") focusOn(f);
      await say(parts[k], 0, true);
      await sleep(PACE.sentence);
    }
  }
  revealAll();
  if (!playing) return;
  if ((c.action === "untether" || c.action === "tether") && boards) {
    const want = c.action === "untether";
    if (!!state.untethered !== want && await post("/api/" + c.action)) {
      await sleep(1000);
      while (playing && (state.busy || !!state.untethered !== want)) await sleep(500);
    }
    await refreshScenarios();
    if (playing) await sleep(2500);
  } else if (st.live && !st.why && boards) {
    if (!state.ready) { $("caption").textContent = "Waiting for the grid to be ready…"; while (playing && !state.ready) await sleep(500); }
    if (!playing) return;
    demoDone = new Promise(r => { demoDone_resolve = r; });
    if (await post("/api/run?s=" + encodeURIComponent(c.demo))) await demoDone;
    demoDone = null;
    if (playing) await sleep(PACE.afterDemo);
  } else if (st.live) {
    $("caption").textContent = !boards ? "This chapter runs live on the boards." : "This live demo needs setup: " + st.why + ".";
    await sleep(2500);
  } else {
    await sleep(PACE.chapterEnd);
  }
}
let demoDone_resolve = () => {};
async function playAll(from) {
  playing = true; renderControls();
  for (let i = from; i < chapters.length && playing; i++) await present(i);
  playing = false; renderControls();
}
async function playOne() {
  playing = true; renderControls();
  await present(at);
  playing = false; renderControls();
}
function stopAll() {
  playing = false;
  if (synth) synth.cancel();
  if (speakingAudio) { speakingAudio.pause(); speakingAudio.onended && speakingAudio.onended(); }
  if (state.busy) post("/api/stop");
  demoDone_resolve();
  renderControls();
}

// ---- the stream ----
function addLog(text) {
  const li = document.createElement("li");
  li.textContent = new Date().toLocaleTimeString() + "  " + text;
  $("log").prepend(li);
  while ($("log").children.length > 40) $("log").lastChild.remove();
}
const LOG_TEXT = {
  registered: m => `${m.board} joined AP ${m.node}`,
  handheld_down: m => `${m.board} lost its access point`,
  link_up: m => `${m.board}: Wi-Fi link up to AP ${m.peer}`,
  link_down: m => `${m.board}: Wi-Fi link down to AP ${m.peer}`,
  lora_link_up: m => `${m.board}: LoRa link up to AP ${m.peer}`,
  lora_link_down: m => `${m.board}: LoRa link down to AP ${m.peer}`,
  boot: m => `${m.board} started (boot ${m.boot})`,
  bb_off: m => `${m.board}: Wi-Fi link between APs off`,
  bb_on: m => `${m.board}: Wi-Fi link between APs on`,
  wifi_off: m => `${m.board}: Wi-Fi off`,
  wifi_on: m => `${m.board}: Wi-Fi on`,
  power_cut: m => `${m.board}: power cut`,
  restart: m => `${m.board}: restarted`,
  split: m => `${m.board}: cut off from the others`,
  backbone_cut: m => `Wi-Fi between APs cut on ${m.board}`,
  mark: m => `${m.board}: after ${m.detail}`,
  tool: m => `${m.board}: ${m.detail}`,
  update_carrying: m => `${m.board}: carrying update ${m.detail.split(" ")[0]}`,
  update_handing: m => `${m.board}: handing the update to device ${m.detail.split(" ")[1]}`,
  update_offered: m => `${m.board}: offered update ${m.detail}`,
  update_taken: m => `${m.board}: downloaded the update`,
  update_restarting: m => `${m.board}: restarting into the update`,
  update_refused: m => `${m.board}: refused the update (${m.detail})`,
  untether: m => `Cables released`,
  finding: m => `Finding: ${m.text}`,
};
function onMessage(m) {
  if (m.type === "state") {
    const was = state.untethered;
    state = m;
    if (!!m.untethered !== !!was) refreshScenarios();
    if (viewNow === "map") drawMap();
    renderControls();
    return;
  }
  if (m.type === "caption") { $("caption").textContent = m.text; if (m.n && performance.now() - openedAt > 400) say(m.text, m.n); return; }
  if (m.type === "fact") {
    const li = document.createElement("li");
    if (m.ok === false) li.className = "bad";
    li.textContent = m.text;
    $("facts").appendChild(li);
    li.scrollIntoView({ block: "nearest" });
    if (m.n && performance.now() - openedAt > 400) say(m.text, m.n);
    return;
  }
  if (m.type === "timer") {
    const t = $("timer");
    $("tlabel").textContent = m.label;
    if (m.state === "start") { t.className = "timer"; timerStart = performance.now(); }
    else { timerStart = null; const none = m.seconds === null || m.seconds === undefined;
           t.className = "timer " + (none ? "fail" : "done"); $("tclock").textContent = none ? "—" : m.seconds.toFixed(1) + " s"; }
    return;
  }
  if (m.type === "flow") {
    if (m.phase === "sent") flows.set(m.token, { from: m.sender, to: new Set(m.to), path: m.path, born: performance.now() });
    else if (m.phase === "landed") {
      bursts.push({ name: m.to, at: performance.now() });
      const f = flows.get(m.token);
      if (f) { f.to.delete(m.to); if (!f.to.size) flows.delete(m.token); }
    }
    return;
  }
  if (m.type === "scenario") {
    if (m.phase === "start") {
      $("facts").innerHTML = ""; $("tlabel").innerHTML = "&nbsp;"; $("tclock").textContent = "0.0 s";
      $("timer").className = "timer"; flows.clear();
      const i = chapters.findIndex(c => c.demo === m.key);
      if (i >= 0 && i !== at && !playing) show(i);
      state.busy = m.key;
    } else { flows.clear(); timerStart = null; state.busy = null; demoDone_resolve(); }
    renderControls();
    return;
  }
  if (m.type === "logs") { addLogLines(m.lines); return; }
  if (m.type === "log" && LOG_TEXT[m.event]) addLog(LOG_TEXT[m.event](m));
}
function connect() {
  const es = new EventSource("/events");
  es.onopen = () => { openedAt = performance.now(); tellNarrate(); };
  es.onmessage = e => onMessage(JSON.parse(e.data));
  es.onerror = () => { $("status").textContent = "Reconnecting…"; };
}

async function refreshScenarios() {
  const s = await fetch("/api/scenarios").then(r => r.json());
  s.scenarios.forEach(x => scenarios[x.key] = x);
  renderChapters(); renderControls();
}
$("prev").onclick = () => show(at - 1);
$("next").onclick = () => show(at + 1);
$("play").onclick = () => playing ? stopAll() : playAll(at);
$("here").onclick = () => playOne();
$("stop").onclick = stopAll;
$("reset").onclick = () => post("/api/reset");
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  if (e.key === " ") { e.preventDefault(); $("play").click(); }
  else if (e.key === "ArrowRight" && !playing) show(at + 1);
  else if (e.key === "ArrowLeft" && !playing) show(at - 1);
  else if (e.key === "Enter" && !$("here").disabled) playOne();
  else if (e.key === "Escape") stopAll();
  else if (e.key === "l" || e.key === "L") toggleLogs();
  else if ((e.key === "r" || e.key === "R") && !$("reset").disabled) post("/api/reset");
});

Promise.all([fetch("/api/scenarios").then(r => r.json()), fetch("/api/story").then(r => r.json()),
             fetch("/api/media").then(r => r.json()).catch(() => ({ files: [] }))]).then(([s, story, media]) => {
  mediaFiles = new Set(media.files);
  fetch("/api/logs").then(r => r.json()).then(j => {
    Object.entries(j.logs || {}).forEach(([key, b]) => addLogLines(b.lines.map(([lv, tx]) => [key, b.role, lv, tx, b.name])));
  }).catch(() => {});
  s.scenarios.forEach(x => scenarios[x.key] = x);
  boards = s.boards; watchUrl = s.watch; localVoices = s.tts || []; localVoiceDefault = s.tts_default; fillVoices();
  chapters = story.chapters;
  show(0);
  connect();
});
</script>
