<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="lg-title">
  <title id="lg-title">LocalGrid</title>
  <!-- Night-camp tile -->
  <rect width="64" height="64" rx="14" fill="#0E1A14"/>
  <!-- Radio waves from the master node at the tent peak -->
  <g fill="none" stroke="#5FD38D" stroke-linecap="round" stroke-width="3">
    <path d="M24.2 14.2 A11 11 0 0 1 39.8 14.2" opacity="0.9"/>
    <path d="M19.3 9.3 A18 18 0 0 1 44.7 9.3" opacity="0.5"/>
  </g>
  <!-- Tent outline = backbone links between three nodes -->
  <path d="M32 22 L14 50 L50 50 Z" fill="none" stroke="#5FD38D" stroke-width="3" stroke-linejoin="round"/>
  <!-- A handheld in the middle, linked to every node -->
  <path d="M32 22 L32 39 M14 50 L32 39 L50 50" fill="none" stroke="#5FD38D" stroke-width="2"
        stroke-linecap="round" opacity="0.6"/>
  <!-- Nodes -->
  <g fill="#5FD38D">
    <circle cx="32" cy="22" r="4.5"/>
    <circle cx="14" cy="50" r="4.5"/>
    <circle cx="50" cy="50" r="4.5"/>
  </g>
  <circle cx="32" cy="39" r="3.5" fill="#0E1A14" stroke="#5FD38D" stroke-width="2"/>
</svg>
